[package]
name = "vigil-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Pure decision logic, so it builds and tests on Linux. The Windows-only calls live behind
# cfg(windows) and are deliberately thin.
[dependencies]

# Only Windows needs registry access; Linux builds and tests stay dependency-free so the
# fast loop keeps running in WSL.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Two calls' worth: broadcasting WM_SETTINGCHANGE so a newly set environment variable reaches
# processes the user starts next. `ui` already depends on the same crate and version.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # `GetAdaptersAddresses`, for the one thing the registry cannot give: the interface index.
    # Reading DNS settings used to shell out to PowerShell and cost 1.3-2.9 s per call, on the UI
    # thread, twice per toggle and once at startup.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # `ShellExecuteExW`, to raise the UAC prompt directly instead of through two PowerShells.
    "Win32_UI_Shell",
    # `GetSystemDirectoryW`. A bare "cmd.exe" is searched for in the *current directory* first, and
    # the thing being launched is being launched as administrator.
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
] }

[[bin]]
name = "vigil-repair"
path = "src/bin/repair.rs"
