[package]
name = "vigil-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The only crate that links the **signature verifier**, and — until 2026-09-07 — the only one that
# linked rustls. That changed deliberately: the resolver in `vigil-proxy` speaks DoH, so rustls now
# reaches `vigil.exe` and `vigil-app.exe` too. `vigil-repair.exe` is unaffected and must stay that
# way: it is the safety net and has to keep working when everything else has gone wrong.
# See docs/18-auto-update.md §1 and docs/19-dns.md §6.
#
# The direction is `update -> proxy -> platform`, never the reverse, and a test asserts it.
[dependencies]
vigil-core = { path = "../core" }
# The resolver that asks an odd port before the operating system, and the same first-flight
# transform every other vigil connection uses. Reused rather than reimplemented: an updater that
# reached the network differently from the proxy would be the one code path nobody had measured.
vigil-proxy = { path = "../proxy" }
# Directly, for the guards: the registry and environment reads, the instance lock, and the same
# restore `vigil-repair` runs. Still the allowed direction — `update -> platform`, never the
# reverse — and platform gains nothing, which is what keeps `vigil-repair.exe` small.
vigil-platform = { path = "../platform" }
# Already in [workspace.dependencies] for probe/, and since 2026-09-07 for proxy/ as well. Three
# doors and no fourth: `update/tests/dependency_isolation.rs` asserts exactly which crates may
# name rustls, so a fifth hand-rolled TLS loop cannot appear without the guard saying so.
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
# One crate, measured zero transitive dependencies, carrying its own curve25519 and SHA-512. The
# entire integrity story, because there is no code-signing certificate.
minisign-verify = "0.2.5"

[lib]
name = "vigil_update"
path = "src/lib.rs"

[[bin]]
name = "vigil-update"
path = "src/bin/update.rs"
